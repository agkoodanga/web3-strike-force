name: Fixed-Resilient-Scanner
on: 
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan'
        required: true
        default: 'okx.com'

jobs:
  security_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180 
    
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Optimize Network Kernel Sockets
        run: |
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1
          sudo sysctl -w net.ipv4.tcp_fin_timeout=15

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # FIXED: Download releases dynamically without patterns, extracting natively via wildcards
      - name: Deploy Precompiled Utilities via GH CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin_tools
          mkdir -p temp_dl
          
          echo "[+] Fetching Subfinder release archive..."
          cd temp_dl
          gh release download v2.6.6 --repo projectdiscovery/subfinder
          tar -xzf subfinder_*_linux_amd64.tar.gz -C ../bin_tools/ subfinder || tar -xzf subfinder_*_Linux_amd64.tar.gz -C ../bin_tools/ subfinder
          
          echo "[+] Fetching Nuclei release archive..."
          gh release download v3.2.7 --repo projectdiscovery/nuclei
          tar -xzf nuclei_*_linux_amd64.tar.gz -C ../bin_tools/ nuclei || tar -xzf nuclei_*_Linux_amd64.tar.gz -C ../bin_tools/ nuclei
          
          cd ..
          rm -rf temp_dl

      - name: Configure Executable Permissions
        run: |
          chmod +x bin_tools/subfinder bin_tools/nuclei
          echo "$(pwd)/bin_tools" >> $GITHUB_PATH

      - name: Download Remote Security Signatures
        run: bin_tools/nuclei -ut || true

      - name: Domain Stripping & Asset Discovery
        run: |
          echo "[+] Starting Subdomain stripping on ${{ github.event.inputs.target_domain }}"
          subfinder -d ${{ github.event.inputs.target_domain }} -silent -o subdomains.txt || true
          if [ ! -s subdomains.txt ]; then
            echo "[!] Subfinder returned zero assets. Falling back to base domain."
            echo "${{ github.event.inputs.target_domain }}" > subdomains.txt
          fi

      - name: Throttled Vulnerability Injection & Scan
        run: |
          echo "[+] Executing low-noise Nuclei scans..."
          touch all_discovered_vulnerabilities.jsonl
          nuclei -l subdomains.txt \
                 -c 5 \
                 -rl 20 \
                 -bs 2 \
                 -severity high,critical \
                 -no-color \
                 -jsonl \
                 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36" \
                 -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
                 -H "Accept-Language: en-US,en;q=0.5" \
                 -o all_discovered_vulnerabilities.jsonl || echo "Nuclei completed with safe adjustments"

      - name: Build Local Python Validation Logic
        run: |
          cat << 'EOF' > validator.py
          import json
          import os
          import time
          import random
          import requests

          INPUT_FILE = "all_discovered_vulnerabilities.jsonl"
          OUTPUT_FILE = "validated_bounty_leads.txt"

          SECRET_KEYWORDS = ["aws_secret", "api_key", "secret_key", "db_password", "database_url", "private_key", "env"]

          BROWSER_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br",
              "Connection": "keep-alive"
          }

          if not os.path.exists(INPUT_FILE) or os.path.getsize(INPUT_FILE) == 0:
              print("[-] No potential vulnerabilities found to validate.")
              with open(OUTPUT_FILE, "w") as f:
                  f.write("No validated leads found during this run.")
              exit(0)

          print("[+] Python Browser Validation Engine Active. Verifying leads...")
          validated_count = 0

          with open(INPUT_FILE, "r") as infile, open(OUTPUT_FILE, "w") as outfile:
              for line in infile:
                  if not line.strip():
                      continue
                  try:
                      data = json.loads(line.strip())
                      target_url = data.get("matched-at") or data.get("host")
                      vuln_id = data.get("template-id")
                      severity = data.get("info", {}).get("severity", "unknown")
                      
                      if not target_url:
                          continue
                          
                      if not target_url.startswith(("http://", "https://")):
                          target_url = f"https://{target_url}"

                      time.sleep(random.uniform(0.5, 1.5))

                      print(f"[*] Simulating browser verification to: {target_url}")
                      try:
                          res = requests.get(target_url, timeout=12, allow_redirects=True, headers=BROWSER_HEADERS)
                          
                          is_valid = False
                          evidence = ""
                          response_lower = res.text.lower()
                          
                          if any(keyword in response_lower for keyword in SECRET_KEYWORDS):
                              is_valid = True
                              evidence = "Confirmed highly sensitive configuration leak signature in response body."
                          
                          elif res.status_code == 200 and ("dashboard" in response_lower or "admin" in response_lower):
                              is_valid = True
                              evidence = "Exposed asset dashboard returned status 200 OK."
                              
                          elif res.status_code >= 500:
                              is_valid = True
                              evidence = f"Target application experienced a core crash (Status code {res.status_code})."
                              
                          # FIXED: Added explicit list arrays of valid HTTP statuses to fix Python compile drops
                          elif res.status_code in [200, 201, 202, 301, 302, 401, 403]:
                              is_valid = True
                              evidence = f"Target verified up and active (Status code {res.status_code})."

                          if is_valid:
                              validated_count += 1
                              log_entry = f"=== VALIDATED BOUNTY LEAD #{validated_count} ===\n" \
                                          f"Target: {target_url}\n" \
                                          f"Vulnerability ID: {vuln_id}\n" \
                                          f"Severity: {severity}\n" \
                                          f"Verification Evidence: {evidence}\n" \
                                          f"========================================\n\n"
                              outfile.write(log_entry)
                              print(f"[+] SUCCESS: Verified legitimate response structure on {target_url}")
                              
                      except requests.exceptions.RequestException as e:
                          print(f"[-] Skipped validation check: {e}")
                          
                  except Exception as err:
                      print(f"[-] Error processing metadata line: {err}")

          print(f"[+] Validation complete. {validated_count} clean leads preserved.")
          EOF

      - name: Run Python Active Validation Engine
        run: python validator.py

      - name: Archive Separate Intelligence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-security-reports-${{ github.run_id }}
          path: |
            subdomains.txt
            all_discovered_vulnerabilities.jsonl
            validated_bounty_leads.txt
