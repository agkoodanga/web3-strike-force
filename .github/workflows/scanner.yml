name: Fixed-Resilient-Scanner
on: 
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan'
        required: true
        default: 'okx.com'

jobs:
  security_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Optimize Network Kernel Sockets
        run: |
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1
          sudo sysctl -w net.ipv4.tcp_fin_timeout=15

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install ProjectDiscovery Tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Runtime Configuration
        run: |
          cat <<EOF > resolvers.txt
          1.1.1.1
          1.0.0.1
          8.8.8.8
          8.8.4.4
          9.9.9.9
          EOF

      - name: Subdomain Discovery
        run: |
          subfinder -d ${{ github.event.inputs.target_domain }} -all -recursive -silent -rL resolvers.txt -o subdomains.txt || true

      - name: Probing for Active Web Servers
        run: |
          if [ -s subdomains.txt ]; then
            httpx -l subdomains.txt -sc -title -td -follow-redirects -p 80,443,8080,8443 -silent -threads 150 -retries 2 -resolvers resolvers.txt -o active_hosts.txt || true
          else
            echo "No subdomains found."
            touch active_hosts.txt
          fi

      - name: High-Performance Vulnerability Scanning
        run: |
          if [ -s active_hosts.txt ]; then
            nuclei -l active_hosts.txt -severity high,critical -rl 150 -bs 25 -c 50 -timeout 10 -stats -si 60 -no-color -jsonl -o all_discovered_vulnerabilities.jsonl || true
          else
            echo "No active hosts to scan."
            touch all_discovered_vulnerabilities.jsonl
          fi

      - name: Run Python Active Validation Engine
        run: python scripts/validator.py

      - name: Archive Separate Intelligence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-security-reports-${{ github.run_id }}
          path: |
            subdomains.txt
            active_hosts.txt
            all_discovered_vulnerabilities.jsonl
            validated_bounty_leads.txt
            resolvers.txt
