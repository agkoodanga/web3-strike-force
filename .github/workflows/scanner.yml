name: Fixed-Resilient-Scanner
on: 
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain to scan'
        required: true
        default: 'okx.com'

jobs:
  security_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180 
    
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Optimize Network Kernel Sockets
        run: |
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1
          sudo sysctl -w net.ipv4.tcp_fin_timeout=15

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Subdomain Discovery
        uses: projectdiscovery/subfinder-action@main
        with:
          domain: ${{ github.event.inputs.target_domain }}
          output: subdomains.txt

      - name: Probing for Active Web Servers
        uses: projectdiscovery/httpx-action@main
        with:
          list: subdomains.txt
          output: active_hosts.txt

      - name: Vulnerability Scanning
        uses: projectdiscovery/nuclei-action@v3
        with:
          list: active_hosts.txt
          severity: high,critical
          args: "-rl 100 -bs 10 -no-color -jsonl -o all_discovered_vulnerabilities.jsonl"

      - name: Run Python Active Validation Engine
        run: python scripts/validator.py

      - name: Archive Separate Intelligence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-security-reports-${{ github.run_id }}
          path: |
            subdomains.txt
            active_hosts.txt
            all_discovered_vulnerabilities.jsonl
            validated_bounty_leads.txt
