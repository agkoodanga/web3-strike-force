name: OKX Exhaustive Code Auditor

on:
  workflow_dispatch:

jobs:
  explore-and-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Install Semgrep Security Scanner
      run: |
        pip install semgrep

    - name: Clone OKX Wallet Core Repository
      run: |
        git clone https://github.com/okx/wallet-core.git target-code

    - name: Run Exhaustive Security Scan
      run: |
        # Strip git limitations entirely so it cannot ignore hidden files
        rm -rf .git
        rm -rf target-code/.git

        # Force exhaustive scanning with specific Web3 and Security rule registries
        semgrep scan \
          --config="p/security-audit" \
          --config="p/solidity" \
          --config="p/typescript" \
          --config="p/javascript" \
          --config="p/secrets" \
          --no-git-ignore \
          --verbose \
          target-code/
