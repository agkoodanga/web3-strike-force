name: OKX Automated Code Explorer

on:
  workflow_dispatch:

jobs:
  explore-and-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Install Semgrep Security Scanner
      run: |
        pip install semgrep

    - name: Clone OKX Wallet Core Repository
      run: |
        git clone https://github.com/okx/wallet-core.git target-code

    - name: Run Deep Security Scan
      run: |
        cd target-code && semgrep scan --config auto
