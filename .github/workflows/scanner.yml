name: OKG Web3 Research Engine

on:
  workflow_dispatch:

jobs:
  research-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Check out your repository
      uses: actions/checkout@v4

    - name: Install and Run Semgrep Security Scanner
      run: |
        pip install semgrep
        semgrep scan --config="p/security-audit" --config="p/solidity" --config="p/golang" --error
